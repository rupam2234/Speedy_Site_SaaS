name = "event-buffer"
main = "src/index.js"
compatibility_date = "2025-07-23"
placement.mode = "smart"

[observability]
enabled = true

[vars]
SUPABASE_URL = "https://tmpvygehhshrgsqxzaty.supabase.co"
SHARD_COUNT = "4"

[[kv_namespaces]]
binding = "SITE_METADATA"
id = "deb4358e164a44fe93dc81a4ef4033b1"

[[durable_objects.bindings]]
class_name = "MyDurableObject"
name = "MY_DURABLE_OBJECT"

[[durable_objects.bindings]]
class_name = "RealtimeHub"
name = "REALTIME_HUB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeHub"]

[env.staging]
name = "event-buffer-staging"

[env.staging.vars]
SUPABASE_URL = "https://tmpvygehhshrgsqxzaty.supabase.co"
SHARD_COUNT = "4"

[[env.staging.kv_namespaces]]
binding = "SITE_METADATA"
id = "deb4358e164a44fe93dc81a4ef4033b1"

[[env.staging.durable_objects.bindings]]
class_name = "MyDurableObject"
name = "MY_DURABLE_OBJECT"

[[env.staging.durable_objects.bindings]]
class_name = "RealtimeHub"
name = "REALTIME_HUB"