_format_version: "3.0"

services:
  # PostgREST API
  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        paths:
          - /rest
        strip_path: true
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Client-Info
            - apikey
          exposed_headers:
            - Content-Range
          credentials: true
          max_age: 86400

  # Realtime
  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime
        paths:
          - /realtime
        strip_path: true

  # Storage
  - name: storage
    url: http://storage:5000
    routes:
      - name: storage
        paths:
          - /storage
        strip_path: true

  # Functions (Edge Runtime)
  - name: functions
    url: http://edge-runtime:9000
    routes:
      - name: functions
        paths:
          - /functions
        strip_path: true

  # Meta
  - name: meta
    url: http://meta:8080
    routes:
      - name: meta
        paths:
          - /meta
        strip_path: true

  # Analytics (Logflare)
  - name: analytics
    url: http://analytics:4000
    routes:
      - name: analytics
        paths:
          - /analytics
        strip_path: true

  # Auth (GoTrue)
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth
        paths:
          - /auth/v1
          - /auth
        strip_path: true

  # Studio (served directly on port 3000, not through Kong)
  # Access at http://localhost:54323