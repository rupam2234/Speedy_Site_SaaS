name: Vercel Deploy

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy Project to Vercel
        id: vercel_deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PROD_FLAG=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROD_FLAG="--prod"
          fi

          # Detach .git temporarily so Vercel CLI does not attach commit author metadata
          # which triggers Vercel Hobby's "author is not a member" restriction.
          if [ -d .git ]; then
            mv .git .git_backup
          fi

          vercel deploy --prebuilt $PROD_FLAG --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }} > deploy_output.txt 2>&1
          DEPLOY_EXIT=$?

          if [ -d .git_backup ]; then
            mv .git_backup .git
          fi

          cat deploy_output.txt

          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deployment failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi

          DEPLOY_URL=$(grep -Eo 'https://[^ ]+\.vercel\.app' deploy_output.txt | tail -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not extract deployment URL from output"
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Publish Deployment Summary
        run: |
          echo "### 🚀 Vercel Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [${{ steps.vercel_deploy.outputs.url }}](${{ steps.vercel_deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
