name: Daily Usage Update

on:
  schedule:
    - cron: "1 0 * * *" # Runs daily at 00:01 UTC
  workflow_dispatch:

jobs:
  trigger-api:
    runs-on: ubuntu-latest

    steps:
      - name: Daily user usage update
        run: |
          curl -f -X POST https://speedy-sense.vercel.app/api/subscriptions/usage \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_TOKEN }}" \
            -H "Content-Type: application/json"
