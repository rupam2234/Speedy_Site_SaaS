name: Daily Crux Job Trigger

on:
  schedule:
    - cron: "30 10 * * *" # Runs daily at 10:30 UTC = 4:00 PM IST
  workflow_dispatch: # Manual trigger support

jobs:
  trigger-api:
    runs-on: ubuntu-latest

    steps:
      - name: Page crux job processor API
        run: |
          curl -X POST https://speedy-sense.vercel.app/api/jobs/process_all
