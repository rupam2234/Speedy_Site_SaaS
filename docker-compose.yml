# Full Stack Production Configuration (Supabase + Next.js Frontend)
# Matches supabase/config.toml ports
# Run: docker compose up --build -d
# Stop: docker compose down
# Reset DB: docker compose down -v && docker compose up --build -d

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.021
    container_name: supabase_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Auth (GoTrue authentication server)
  # ---------------------------------------------------------------------------
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    container_name: supabase_auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@email.com
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: speedy-site
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Database Migrations (runs after db and auth initialize schemas)
  # ---------------------------------------------------------------------------
  migrate:
    image: supabase/postgres:15.8.1.021
    container_name: supabase_migrate
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text PRIMARY KEY, statements text[], name text);"
        for f in /migrations/*.sql; do
          [ -f "$$f" ] || continue
          base="$$(basename "$$f" .sql)"
          ver="$${base%%_*}"
          name="$${base#*_}"
          applied="$$(psql -h db -U postgres -d postgres -tAc "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '$${ver}'")"
          if [ "$$applied" != "1" ]; then
            echo "Applying migration $$base..."
            psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$$f"
            psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -c "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('$${ver}', '$${name}') ON CONFLICT DO NOTHING;"
          fi
        done
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: "no"
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # PostgREST API (RESTful API on top of PostgreSQL)
  # ---------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: supabase_rest
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Kong API Gateway (routes requests to rest, auth, realtime, storage, etc.)
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.4
    container_name: supabase_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,correlation-id,acl,key-auth
    ports:
      - "54321:8000"
      - "5443:8443"
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Realtime Server (WebSocket for realtime subscriptions)
  # ---------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v0.38.22
    container_name: supabase_realtime
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SECRET_KEY_BASE: not-the-production-secret-key-base-change-me
      ERL_AFLAGS: "-proto_dist inet_tcp"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Storage API (S3-compatible file storage)
  # ---------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.4
    container_name: supabase_storage
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # imgproxy (on-the-fly image transformations)
  # ---------------------------------------------------------------------------
  imgproxy:
    image: darthsim/imgproxy:v3.9.0
    container_name: supabase_imgproxy
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage_data:/var/lib/storage:ro
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Meta (Supabase metadata API for CLI)
  # ---------------------------------------------------------------------------
  meta:
    image: supabase/meta:v0.76.0
    container_name: supabase_meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Studio (Dashboard UI)
  # ---------------------------------------------------------------------------
  studio:
    image: supabase/studio:20241202-5b1f6e2
    container_name: supabase_studio
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      STUDIO_PG_META_HOST: meta
      STUDIO_PG_META_PORT: 8080
      DEFAULT_ORGANIZATION: local
      DEFAULT_PROJECT: local
    ports:
      - "54323:3000"
    depends_on:
      - meta
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Inbucket (Email testing UI)
  # ---------------------------------------------------------------------------
  inbucket:
    image: inbucket/inbucket:v2.4.0
    container_name: supabase_inbucket
    ports:
      - "54324:54324"
      - "54325:2500"
      - "54326:1100"
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Edge Runtime (Deno-based edge functions)
  # ---------------------------------------------------------------------------
  edge-runtime:
    image: supabase/edge-runtime:v1.64.4
    container_name: supabase_edge_runtime
    environment:
      SUPABASE_EDGE_RUNTIME_PORT: 9000
      SUPABASE_EDGE_RUNTIME_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Logflare (Analytics/Logs)
  # ---------------------------------------------------------------------------
  analytics:
    image: supabase/logflare:1.7.0
    container_name: supabase_analytics
    environment:
      LOGFLARE_SINGLE_TENANT_MODE: "true"
      LOGFLARE_API_KEY: "supabase-analytics-key"
      LOGFLARE_PRIVATE_API_KEY: "supabase-private-analytics-key"
      LOGFLARE_PG_HOST: db
      LOGFLARE_PG_PORT: 5432
      LOGFLARE_PG_USER: postgres
      LOGFLARE_PG_PASSWORD: postgres
      LOGFLARE_PG_DATABASE: postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Vector (pgvector for AI/embeddings)
  # ---------------------------------------------------------------------------
  vector:
    image: supabase/postgres:15.8.1.021
    container_name: supabase_vector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    command: >
      postgres -c shared_preload_libraries=vector
      -c max_connections=100
    ports:
      - "54327:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase

  # ---------------------------------------------------------------------------
  # Frontend (Next.js Production Server)
  # ---------------------------------------------------------------------------
  frontend:
    image: speedy-site-frontend
    container_name: speedy-site-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
        NEXT_PUBLIC_DEV_BASE_URL: ${NEXT_PUBLIC_DEV_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_PROD_BASE_URL: ${NEXT_PUBLIC_PROD_BASE_URL:-http://localhost:3000}
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3000}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      NEXT_PUBLIC_DEV_BASE_URL: ${NEXT_PUBLIC_DEV_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_PROD_BASE_URL: ${NEXT_PUBLIC_PROD_BASE_URL:-http://localhost:3000}
    depends_on:
      kong:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  supabase:
    name: supabase_network
    driver: bridge

volumes:
  db_data:
  storage_data:
  vector_data:
